name: CI

# The compiler is portable Rust, but what it *produces* is C++ built by the host's own
# toolchain, and what it reads is headers parsed by the host's libclang. Those are the
# parts that differ per platform, so the point of this matrix is not the Rust build —
# it is that `dz` drives three different C++ toolchains to the same result.
#
# Lints run on a **pinned** toolchain, and the build and tests on stable. `-D warnings`
# against a floating stable means any new lint Rust ships turns CI red through no change of
# ours, which is exactly what happened the first time this ran: 1.98 added `question_mark`
# and the Linux and macOS jobs failed on code that had been fine. Bump LINT_TOOLCHAIN
# deliberately, see what the new release thinks, and fix it in its own commit.
#
# It runs once per change: on the pull request, or on master for a commit pushed there
# directly. A PR lands on master by rebase, which makes new commits with GitHub as their
# committer; the job skips those, since the PR's run already tested them (as merged into
# master, which is what `pull_request` checks out). To try a branch with no PR, run it by
# hand: `gh workflow run CI --ref <branch>`.
#
# A change that cannot alter what is built or tested does not need a 30-minute run, hence
# the paths-ignore, the same for both triggers. Not `**.md`: `crates/dz_diag/explain/*.md`
# is compiled into `dz explain`. `*` stops at `/`, so `*.md` is only the README,
# CONTRIBUTING and CLAUDE.md at the root.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "editors/**"
      - "tools/**"
      - ".claude/**"
      - ".github/logo.png"
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "editors/**"
      - "tools/**"
      - ".claude/**"
      - ".github/logo.png"
  workflow_dispatch:

# Two pushes in quick succession, to master or to one PR, test only the second: it contains
# the first, so finishing the older run would spend the time and say nothing the newer one
# will not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The toolchain clippy and rustfmt run on. Pinned on purpose — see the note above.
  LINT_TOOLCHAIN: "1.98"
  # A CI machine has no incremental cache worth keeping between jobs, and building one
  # costs both time and disk.
  CARGO_INCREMENTAL: 0
  # The tests are a compiler run thousands of times, and unoptimised that is most of the
  # job: `tolerant.rs` alone took six and a half minutes on Linux, against about a third of
  # that at opt-level 1, which costs only seconds more to build. Debug assertions and
  # overflow checks are their own settings and stay on. Here rather than in Cargo.toml,
  # where it would slow every local edit-and-rebuild too.
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_PROFILE_TEST_OPT_LEVEL: 1

jobs:
  test:
    name: ${{ matrix.name }}
    # A push GitHub committed is a rebase-merged PR, already tested on the PR.
    if: github.event_name != 'push' || github.event.head_commit.committer.email != 'noreply@github.com'
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a fact worth having about the other two, so let them finish.
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            cxx: g++
          - name: macos
            os: macos-latest
            cxx: clang++
          - name: windows
            os: windows-latest
            cxx: clang++

    env:
      # Which C++ compiler `dz` drives. Without it `dz` picks the first of clang++, g++,
      # c++ that it finds, and the matrix would not know which one it tested.
      DZ_CXX: ${{ matrix.cxx }}

    steps:
      # raylib and RGFW are submodules under `examples/vendor/`, and `every_example_builds`
      # compiles them from that source.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust (stable, for the build and tests)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install Rust (pinned, for the lints)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.LINT_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # `import cpp` loads libclang at run time (`clang-sys`'s "runtime" feature), so it is
      # an installed-package problem rather than a build one. Without it every interop test
      # reports DZ0703 and skips — which would look like a pass.
      - name: Install libclang and the window-system headers (linux)
        if: matrix.name == 'linux'
        run: |
          # The runner image ships LLVM, and `dz` only needs libclang's shared library,
          # which clang-sys also finds as `libclang.so.1`. libclang-dev adds headers and
          # static archives on top — 29 MB, which on a slow day for the Ubuntu mirror was
          # seven minutes of the job — so it is installed only when the image has none.
          libclang=libclang-dev
          if ls /usr/lib/llvm-*/lib/libclang.so.1 >/dev/null 2>&1; then libclang=; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $libclang \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev
          # Not `llvm-config --libdir`: Ubuntu installs it versioned (`llvm-config-18`),
          # so the bare name is usually absent and the command substitution silently
          # produced an empty path. Find the library itself instead — and by its exact
          # name, newest LLVM first. A `libclang*.so*` glob also matches the sanitizer
          # runtimes (`libclang_rt.memprof-x86_64.so`) the runner image ships, `find`'s
          # order is not fixed, and clang-sys searches *only* LIBCLANG_PATH once it is set,
          # so a run that picked one of those failed every interop test.
          lib=$(ls /usr/lib/llvm-*/lib/libclang.so /usr/lib/llvm-*/lib/libclang.so.1 \
            2>/dev/null | sort -V | tail -n1)
          if [ -z "$lib" ]; then
            echo "::error::libclang not found, even after installing libclang-dev"
            exit 1
          fi
          echo "found $lib"
          echo "LIBCLANG_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"

      - name: Locate libclang (macos)
        if: matrix.name == 'macos'
        run: |
          # The Xcode command line tools ship libclang; Homebrew's llvm is the fallback.
          if [ -f /Library/Developer/CommandLineTools/usr/lib/libclang.dylib ]; then
            echo "LIBCLANG_PATH=/Library/Developer/CommandLineTools/usr/lib" >> "$GITHUB_ENV"
          else
            brew install llvm
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          fi

      - name: Locate libclang (windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $dir = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $dir "libclang.dll"))) {
            choco install llvm --no-progress -y
          }
          "LIBCLANG_PATH=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Printed rather than assumed: when a platform's interop tests skip, this is the line
      # that says why.
      - name: Report the toolchain
        shell: bash
        run: |
          rustc -vV
          "$DZ_CXX" --version
          echo "LIBCLANG_PATH=${LIBCLANG_PATH:-<unset>}"
          # Without libclang every `import cpp` test reports DZ0703 and *skips*, which
          # reads as a pass. Stop here instead, so a missing dependency is a red job
          # rather than a quietly reduced test suite.
          if [ -z "${LIBCLANG_PATH:-}" ] && [ "${{ matrix.name }}" != "windows" ]; then
            echo "::error::LIBCLANG_PATH is unset; the interop tests would silently skip"
            exit 1
          fi

      - name: Build
        run: cargo build --workspace --all-targets

      # The website's playground runs this `dz` in the browser. A dependency that cannot
      # target WebAssembly would break it without failing anything else here. `+stable`
      # because that is the toolchain the target was installed for: the lint toolchain's
      # install, which runs after it, becomes the default.
      - name: Build for WebAssembly
        if: matrix.name == 'linux'
        run: cargo +stable build -p dz --target wasm32-wasip1

      # One platform is enough for the lints: they read the source, which is the same
      # everywhere, and running them three times only triples the chance of a flake.
      - name: Clippy
        if: matrix.name == 'linux'
        run: cargo +${{ env.LINT_TOOLCHAIN }} clippy --workspace --all-targets -- -D warnings

      # `rustfmt.toml` sets `use_small_heuristics = "Max"`, which is what keeps rustfmt's
      # output close to how this repository was already written by hand.
      - name: Format
        if: matrix.name == 'linux'
        run: cargo +${{ env.LINT_TOOLCHAIN }} fmt --all -- --check

      - name: Test
        run: cargo test --workspace

      # Invariant 7: generated C++ must compile warning-clean on more than one compiler.
      # `run.rs` builds with whichever it is given, so on the platform that has both, it runs
      # again against the other. Only it: nothing else reads DZ_CXX (`matrix.rs` already
      # tries every compiler present), and re-running the whole suite here doubled the job.
      - name: Test against clang++ as well
        if: matrix.name == 'linux'
        env:
          DZ_CXX: clang++
        run: cargo test -p dz --test run

      # `dz`'s own commands, exercised the way a user meets them rather than through the
      # Rust test harness.
      - name: dz test
        run: cargo run -p dz -- test tests/run/tests

      - name: dz bench
        run: cargo run -p dz -- bench tests/bench

      # The examples are the first Dazzle a visitor reads, so they are held to `dz fmt`.
      - name: dz fmt --check examples
        if: matrix.name == 'linux'
        run: find examples -name '*.dz' -not -path '*/vendor/*' -not -path '*/build/*' -print0 | xargs -0 cargo run -q -p dz -- fmt --check
