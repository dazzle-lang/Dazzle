[workspace]
resolver = "2"
members = [
    "crates/dz_span",
    "crates/dz_diag",
    "crates/dz_lex",
    "crates/dz_ast",
    "crates/dz_parse",
    "crates/dz_fmt",
    "crates/dz_project",
    "crates/dz_macro",
    "crates/dz_resolve",
    "crates/dz_hir",
    "crates/dz_check",
    "crates/dz_flow",
    "crates/dz_mono",
    "crates/dz_cpp",
    "crates/dz_cppimport",
    "crates/dz_driver",
    "crates/dz_lsp",
    "crates/dz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
dz_span = { path = "crates/dz_span" }
dz_diag = { path = "crates/dz_diag" }
dz_lex = { path = "crates/dz_lex" }
dz_ast = { path = "crates/dz_ast" }
dz_parse = { path = "crates/dz_parse" }
dz_fmt = { path = "crates/dz_fmt" }
dz_project = { path = "crates/dz_project" }
dz_macro = { path = "crates/dz_macro" }
dz_resolve = { path = "crates/dz_resolve" }
dz_hir = { path = "crates/dz_hir" }
dz_check = { path = "crates/dz_check" }
dz_flow = { path = "crates/dz_flow" }
dz_mono = { path = "crates/dz_mono" }
dz_cpp = { path = "crates/dz_cpp" }
dz_cppimport = { path = "crates/dz_cppimport" }
dz_driver = { path = "crates/dz_driver" }
dz_lsp = { path = "crates/dz_lsp" }

codespan-reporting = "0.11"
lsp-server = "0.7"
lsp-types = "0.95"
serde = "1"
serde_json = "1"
unicode-ident = "1"
insta = { version = "1", features = ["glob"] }

[profile.dev]
# Line tables rather than full debug info. A panic still names the file and line it came
# from, which is what a compiler's own test suite reports with; what is given up is
# inspecting variables while stepping in a debugger.
#
# The reason is size: on windows-msvc full debug info is separate `.pdb` files, and the
# workspace's were 1.3 GB of a 4.7 GB `target/` — made worse by cargo never collecting the
# artifacts of earlier builds, so every stale `dz.pdb` was kept too.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
