[module]
name    = "not a valid name"
version = 3
sources = "src/**/*.dz"

[build]
output    = "library"
optimize  = "fastest"
type_info = "used"

[dependencies]
missing = { path = "../nowhere" }
noPath  = { version = "1.0" }

# spec §15.1: paths are checked, and so is every target section on every platform.
[cpp]
include_dirs = ["no/such/dir"]

[cpp.target.amiga]
defines = ["AMIGA"]

[cpp.libs.broken]
sources = ["missing.c", "dazzle.toml"]
# `flags` used to be the unknown key here; it became a real one when raylib needed
# `-x objective-c` on macOS (spec §15.1), so this is a key that is still not one.
optimise = "fast"
