[module]
name = "ownership"
sources = ["src/**/*.dz"]

[build]
output = "executable"

[dependencies]
std = {open = true}
c = {cpp = "cstdlib"}

# C's own heap, which the shelf takes its memory from. Dazzle code names no allocator, so a
# container written outside `std` imports `malloc` and `free` like any other C function
# (spec §14, §15.1).
[cpp.libs.cstdlib]
import = ["stdlib.h"]
# `malloc` and `free` may be called from any thread at once, so the shelf's `clone` may run
# on any thread too (spec §15.1, §22.5).
thread_safe = ["malloc", "free"]
