[module]
name    = "scene"
sources = ["src/**/*.dz"]

[dependencies]
std = { open = true }
sdl   = { cpp = "sdl3" }
gl    = { cpp = "glad" }
imgui = { cpp = "imgui" }

# SDL3 built by its own CMake, which `dz` runs with the compilers it uses itself and
# installs into build/cmake/ (spec §15.1). SDL is a git submodule pinned to its 3.4.18 tag;
# `git submodule update --init` fetches it. The headers `import` reads and the link line
# are what the build installed.
[cpp.libs.sdl3]
cmake   = "../vendor/SDL"
options = { SDL_SHARED = false, SDL_STATIC = true, SDL_TEST_LIBRARY = false, SDL_EXAMPLES = false }
import  = ["SDL3/SDL.h"]
# Vouches for SDL: what the calls here take, an event or a size to fill, is written
# during the call and not kept (spec §15.2).
keeps   = []

# OpenGL past version 1.1 is not exported by the system library on every platform (on
# Windows, `opengl32.dll` has nothing newer), so its functions are asked of the driver at
# run time. glad is the loader generated for that, a single header with its implementation
# behind a define; raylib ships one for OpenGL 4.3 core, so this reuses raylib's copy rather
# than vendoring another. Its folder also holds raylib's own `dirent.h`, which would hide
# the system's, so the include path is the folder above it. `main` hands glad
# `SDL_GL_GetProcAddress` once the context exists.
[cpp.libs.glad]
root         = "../vendor/raylib/src"
header       = "external/glad.h"
include_dirs = ["."]
# raylib's copy leaves its allocator to the includer, as raylib sets it to its own.
defines      = ["GLAD_GL_IMPLEMENTATION", "GLAD_MALLOC=malloc", "GLAD_FREE=free"]
import       = ["external/glad.h"]
# OpenGL keeps only a `void*` it is given, as a client-side vertex array, and only
# `unsafe` makes one (spec §15.2).
keeps        = []

# Dear ImGui, a C++ library, built from its own source: its four core files and the two
# backends that read SDL3's input and draw with OpenGL 3. ImGui is a git submodule pinned
# to its v1.93.0 tag. The OpenGL backend loads the GL functions it needs itself, so it does
# not need glad.
[cpp.libs.imgui]
root         = "../vendor/imgui"
sources      = ["imgui.cpp", "imgui_draw.cpp", "imgui_tables.cpp", "imgui_widgets.cpp",
                "backends/imgui_impl_sdl3.cpp", "backends/imgui_impl_opengl3.cpp"]
include_dirs = [".", "backends"]
# The SDL3 backend includes `SDL3/SDL.h`, which only SDL's CMake build installs, at a path
# that depends on its configuration: `uses` builds ImGui against that install (spec §15.1).
uses         = ["sdl3"]
import       = ["imgui.h", "imgui_impl_sdl3.h", "imgui_impl_opengl3.h"]
# Vouches for ImGui: a widget reads and writes what it is handed during the call and keeps
# nothing (a label is hashed, a value copied), and the backends keep only the window and
# the context, which are handles (spec §15.2).
keeps        = []
