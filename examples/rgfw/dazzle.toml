[module]
name    = "rgfw"
sources = ["src/**/*.dz"]

[dependencies]
rgfw = { cpp = "rgfw" }
std = { open = true }

# RGFW is a single-header library: its declarations are `RGFWDEF`, which is `inline` unless
# told otherwise, because it expects to be included in one translation unit. Here there are
# two — its own source and Dazzle's generated code — so `RGFWDEF=` gives them external
# linkage. `[cpp]` is the right table for it: it has to hold for both.
[cpp]
defines = ["RGFWDEF="]

# The library itself, compiled from source by `dz` (spec §15.1): a git submodule in
# `examples/vendor/RGFW`, which `git submodule update --init` fetches. RGFW is a
# single-header library: `header` names it, and `dz` compiles the one translation unit that
# includes it with `RGFW_IMPLEMENTATION` defined. Nothing else sees that define, so nothing
# is defined twice.
[cpp.libs.rgfw]
root         = "../vendor/RGFW"
header       = "RGFW.h"
include_dirs = ["."]
defines      = ["RGFW_IMPLEMENTATION"]
import       = ["RGFW.h"]

# The window system each platform's backend calls into. These were `link_libs` at the top
# of the recipe and so applied everywhere, which meant this fixture could only ever link on
# Windows: `opengl32` and `gdi32` do not exist elsewhere. A `target.<os>` section is how a
# recipe says "only here" (spec §15.1).
[cpp.libs.rgfw.target.windows]
link_libs = ["opengl32", "gdi32"]

[cpp.libs.rgfw.target.linux]
link_libs = ["GL", "X11", "Xrandr", "m", "dl", "pthread"]

# macOS system libraries are frameworks, not `-l` names.
[cpp.libs.rgfw.target.macos]
frameworks = ["Cocoa", "OpenGL", "IOKit", "CoreVideo"]