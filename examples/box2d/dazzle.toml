[module]
name    = "physics"
sources = ["src/**/*.dz"]

[dependencies]
std = { open = true }
b2  = { cpp = "box2d" }
sk  = { cpp = "sokol" }

# Upstream sets the instruction set per translation unit, including /arch:AVX2
# on the wide contact solver alone when compiling with MSVC.
[cpp.libs.box2d]
cmake   = "../vendor/box2d"
options = { BOX2D_SAMPLES = false, BOX2D_UNIT_TESTS = false }
import       = ["box2d/box2d.h"]
# Vouches for Box2D: no function keeps a pointer it is given past the call. A body's
# `userData` is kept, but it is a `void*`, which only `unsafe` makes (spec §15.2).
keeps        = []

[cpp.libs.box2d.target.linux]
link_libs = ["m"]

# sokol draws it, exactly as in `examples/sokol`, whose manifest explains each line.
[cpp]
defines = ["SOKOL_GLCORE", "SOKOL_NO_ENTRY"]

[cpp.libs.sokol]
root         = "../vendor/sokol"
header       = "util/sokol_gl.h"
include_dirs = [".", "util"]
defines      = ["SOKOL_IMPL"]
flags        = ["-include", "sokol_log.h", "-include", "sokol_gfx.h",
                "-include", "sokol_app.h", "-include", "sokol_glue.h"]
import       = ["sokol_log.h", "sokol_gfx.h", "sokol_app.h", "sokol_glue.h", "sokol_gl.h"]
# As in `examples/sokol`: no function keeps a pointer past the call (spec §15.2).
keeps        = []

[cpp.libs.sokol.target.windows]
link_libs = ["kernel32", "user32", "shell32", "gdi32"]

[cpp.libs.sokol.target.linux]
link_libs = ["X11", "Xi", "Xcursor", "GL", "dl", "pthread", "m"]

[cpp.libs.sokol.target.macos]
flags      = ["-x", "objective-c"]
frameworks = ["Cocoa", "QuartzCore", "OpenGL"]
